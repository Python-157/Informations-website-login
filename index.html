<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input { display:block; margin: 8px 0; padding: 8px; width: 250px; }
    button { padding: 10px; margin: 5px 0; width: 260px; }
  </style>
</head>
<body>

<h2>Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Passwort">

<button id="loginEmail">Login mit Email</button>
<button id="registerEmail">Registrieren</button>
<button id="forgotPassword">Passwort vergessen</button>

<hr>

<button id="loginGoogle">Login mit Google</button>
<button id="loginApple">Login mit Apple</button>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { 
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    sendPasswordResetEmail,
    GoogleAuthProvider,
    OAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDKFtrioHVXgazXOtQ7IBHYg3b-blYRiPA",
    authDomain: "itsf-adc8b.firebaseapp.com",
    databaseURL: "https://itsf-adc8b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "itsf-adc8b",
    storageBucket: "itsf-adc8b.firebasestorage.app",
    messagingSenderId: "183687989677",
    appId: "1:183687989677:web:723bccfafdca93371ef924",
    measurementId: "G-ZKC3090E08"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  // ---------------------------
  // Email Login
  // ---------------------------
  loginEmail.onclick = () => {
    signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
      .then(() => window.location.href = "angemeldet.html")
      .catch(err => alert(err.message));
  };

  // ---------------------------
  // Registrierung
  // ---------------------------
  registerEmail.onclick = () => {
    createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
      .then(() => alert("Registrierung erfolgreich!"))
      .catch(err => alert(err.message));
  };

  // ---------------------------
  // Passwort vergessen
  // ---------------------------
  forgotPassword.onclick = () => {
    sendPasswordResetEmail(auth, emailInput.value)
      .then(() => alert("Email zum Zurücksetzen wurde gesendet"))
      .catch(err => alert(err.message));
  };

  // ---------------------------
  // Google Login
  // ---------------------------
  loginGoogle.onclick = () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider)
      .then(() => window.location.href = "angemeldet.html")
      .catch(err => alert(err.message));
  };

  // ---------------------------
  // Apple Login
  // ---------------------------
  loginApple.onclick = () => {
    const provider = new OAuthProvider("apple.com");
    signInWithPopup(auth, provider)
      .then(() => window.location.href = "angemeldet.html")
      .catch(err => alert(err.message));
  };

</script>

</body>
</html>
