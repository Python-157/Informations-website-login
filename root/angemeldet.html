<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Angemeldet</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { padding: 10px; margin: 5px 0; width: 260px; }
  </style>
</head>
<body>

<h2>Du bist angemeldet!</h2>

<button id="weiter">Weiter</button>
<button id="logout">Abmelden</button>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } 
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDKFtrioHVXgazXOtQ7IBHYg3b-blYRiPA",
    authDomain: "itsf-adc8b.firebaseapp.com",
    databaseURL: "https://itsf-adc8b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "itsf-adc8b",
    storageBucket: "itsf-adc8b.firebasestorage.app",
    messagingSenderId: "183687989677",
    appId: "1:183687989677:web:723bccfafdca93371ef924",
    measurementId: "G-ZKC3090E08"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const redirectURL = "https://sites.google.com/view/info-asec-554asd6-login/sec-fjg9t8g48-t4g8w4gtr7g789tg4rtg4t8grg48tg4rgrg9t489gg5g898484889r4g84rg9/startseite-security";

  // ---------------------------
  // Weiter → Weiterleiten + Abmelden
  // ---------------------------
  weiter.onclick = async () => {
    await signOut(auth);
    window.location.href = redirectURL;
  };

  // ---------------------------
  // Abmelden normal
  // ---------------------------
  logout.onclick = async () => {
    await signOut(auth);
    window.location.href = "index.html";
  };

  // ---------------------------
  // Falls nicht angemeldet → zurück
  // ---------------------------
  onAuthStateChanged(auth, user => {
    if (!user) window.location.href = "index.html";
  });

</script>

</body>
</html>
